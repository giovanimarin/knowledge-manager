packages:
  - apps/*
  - packages/*
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  protobufjs: set this to true or false
minimumReleaseAgeExclude:
  - vite@8.4.0
  - "@nestjs/common@12.6.3"
  - "@nestjs/core@12.6.3"
  - "@nestjs/platform-express@12.6.3"
