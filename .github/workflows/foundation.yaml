name: Foundation

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Foundation / verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Reject deliberately for the ruleset test
        run: |
          echo "::error::Intentional failure for Main Protection ruleset 28200918"
          exit 1

  smoke:
    name: Foundation / clean smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KM_BUILD_CA: ${{ github.workspace }}/.km-build-ca.pem
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: pnpm install --frozen-lockfile
      - run: cp /etc/ssl/certs/ca-certificates.crt "$KM_BUILD_CA"
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/integration.sh 2>&1 | tee artifacts/integration.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: foundation-smoke
          path: |
            artifacts/
            playwright-report/
            test-results/

  audit:
    name: Foundation / audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KM_BUILD_CA: ${{ github.workspace }}/.km-build-ca.pem
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: pnpm install --frozen-lockfile
      - run: cp /etc/ssl/certs/ca-certificates.crt "$KM_BUILD_CA"
      - run: bash scripts/audit.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: foundation-audit
          path: artifacts/audit/

  protection-evidence:
    name: Main Protection / read-only evidence
    if: ${{ always() && github.head_ref == 'test/main-protection-28200918' }}
    needs: [verify, smoke, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      AUDIT_RESULT: ${{ needs.audit.result }}
    steps:
      - name: Read branch rules and PR merge state
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.ruleset_id == 28200918)]' || true
          test "$VERIFY_RESULT" = failure
          test "$SMOKE_RESULT" = success
          test "$AUDIT_RESULT" = success
          for attempt in {1..12}; do
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
            jq '{number,head:.head.sha,base:.base.ref,draft,mergeable,mergeable_state}' <<< "$pr"
            if jq -e '.base.ref == "main" and .draft == false and .mergeable == true and .mergeable_state == "blocked"' <<< "$pr" >/dev/null; then
              echo "Intentional required check failure. GitHub reports mergeable_state=blocked."
              exit 0
            fi
            sleep 10
          done
          exit 1
