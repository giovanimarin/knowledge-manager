name: Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Foundation / verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  smoke:
    name: Foundation / clean smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KM_BUILD_CA: ${{ github.workspace }}/.km-build-ca.pem
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: pnpm install --frozen-lockfile
      - run: cp /etc/ssl/certs/ca-certificates.crt "$KM_BUILD_CA"
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/integration.sh 2>&1 | tee artifacts/integration.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: foundation-smoke
          path: |
            artifacts/
            playwright-report/
            test-results/

  audit:
    name: Foundation / audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KM_BUILD_CA: ${{ github.workspace }}/.km-build-ca.pem
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: pnpm install --frozen-lockfile
      - run: cp /etc/ssl/certs/ca-certificates.crt "$KM_BUILD_CA"
      - run: bash scripts/audit.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: foundation-audit
          path: artifacts/audit/
